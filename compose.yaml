name: pikmin-turns
services:
  web:
    build:
      context: .
      args:
        OCI_REVISION: ${OCI_REVISION:?set the checked-out source revision before building}
        OCI_CREATED: ${OCI_CREATED:?set the release timestamp before building}
    restart: unless-stopped
    expose: ["3000"]
    environment:
      DATA_FILE: /data/games.json
    volumes:
      - game-data:/data
    networks: [proxy]
    labels:
      - org.opencontainers.image.revision=${OCI_REVISION:?set the checked-out source revision before building}
      - org.opencontainers.image.created=${OCI_CREATED:?set the release timestamp before building}
      - traefik.enable=true
      - "traefik.http.routers.pikmin-turns.rule=Host(`pikmin-turns.ichabod-crane.net`)"
      - traefik.http.routers.pikmin-turns.entrypoints=websecure
      - traefik.http.routers.pikmin-turns.tls.certresolver=letsencrypt
      - traefik.http.services.pikmin-turns.loadbalancer.server.port=3000
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: 10m, max-file: "3"}
networks:
  proxy: {external: true, name: ichabod-proxy}
volumes:
  game-data:
