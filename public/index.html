<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pikmin Turns</title><style>body{max-width:700px;margin:2rem auto;padding:0 1rem;background:#132419;color:#f6f0d8;font:18px system-ui}button,input{font:inherit;padding:.55rem;margin:.2rem}button{background:#e5a642;border:0;border-radius:.4rem}#game{display:none}.card{background:#203c28;padding:1rem;border-radius:.7rem;margin:1rem 0}#log{height:12rem;overflow:auto;font-size:.9rem}strong{color:#ffd96a}</style><h1>🌱 Pikmin Turns</h1><p>A tiny, turn-based garden skirmish for two commanders. Six rounds take about five minutes.</p><section id="lobby" class="card"><label>Commander <input id="name" maxlength="24" placeholder="Olimar"></label><button onclick="host()">Create landing site</button><p>or join a code: <input id="code" maxlength="6" placeholder="ABC123"><button onclick="join()">Join</button></p><output id="error"></output></section><main id="game"><div class="card"><strong id="codeout"></strong> · <span id="phase"></span><p id="status"></p></div><div class="card" id="players"></div><div class="card"><p id="order"></p><div id="actions"><button onclick="act('forage')">Forage (+1 score)</button><button onclick="act('recruit')">Recruit (2 nectar)</button><button onclick="act('raid')">Raid (2 Pikmin, +3)</button><button onclick="act('rest')">Rest (+1 Pikmin)</button></div></div><div class="card"><strong>Field log</strong><div id="log"></div></div></main><script src="app.js"></script></html>
